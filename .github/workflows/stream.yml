name: YouTube Live Stream

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Video / Live Stream URL'
        required: true
      stream_key:
        description: 'YouTube Stream Key'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg curl
        python -m pip install --upgrade pip
        pip install requests yt-dlp

    - name: Run Live Streaming
      env:
        VIDEO_URL: ${{ github.event.inputs.video_url }}
        STREAM_KEY: ${{ github.event.inputs.stream_key }}
      run: |
        cat << 'EOF' > run_stream.py
        import subprocess, sys, os, requests, json

        v_url = os.environ.get('VIDEO_URL')
        s_key = os.environ.get('STREAM_KEY')

        stream_direct_url = None

        # Method 1: Try Cobalt API
        try:
            cobalt_payload = {
                "url": v_url,
                "videoQuality": "1080",
                "isAudioOnly": False
            }
            cobalt_headers = {
                "Accept": "application/json",
                "Content-Type": "application/json"
            }
            res = requests.post("https://api.cobalt.tools/api/json", json=cobalt_payload, headers=cobalt_headers, timeout=12)
            if res.status_code == 200:
                data = res.json()
                if "url" in data:
                    stream_direct_url = data["url"]
        except Exception as e:
            print(f"Cobalt failed: {e}")

        # Method 2: Fallback to PipePipe API
        if not stream_direct_url:
            try:
                import re
                v_id = re.search(r"(?:v=|\/)([0-9A-Za-z_-]{11})", v_url).group(1)
                res = requests.get(f"https://pipedapi.kavin.rocks/streams/{v_id}", timeout=10)
                if res.status_code == 200:
                    data = res.json()
                    if "hls" in data and data["hls"]:
                        stream_direct_url = data["hls"]
                    elif "videoStreams" in data and len(data["videoStreams"]) > 0:
                        stream_direct_url = data["videoStreams"][0]["url"]
            except Exception as e:
                print(f"PipePipe failed: {e}")

        if not stream_direct_url:
            print("ERROR: Could not fetch stream URL from any API.")
            sys.exit(1)

        print(f"Success! Direct Stream Link Fetched.")

        filter_v = (
            "select='lt(mod(t,26),25)',setpts=N/FRAME_RATE/TB,"
            "hflip,scale=1920:1080,"
            "crop=w='if(lt(mod(t,78),26),iw,if(lt(mod(t,78),52),iw*0.92,iw*0.95))':"
                 "h='if(lt(mod(t,78),26),ih,if(lt(mod(t,78),52),ih*0.92,ih*0.95))':"
                 "x='if(lt(mod(t,78),26),0,if(lt(mod(t,78),52),iw*0.04,iw*0.02))':"
                 "y='if(lt(mod(t,78),26),0,if(lt(mod(t,78),52),ih*0.04,ih*0.01))':exact=1,"
            "scale=1920:1080,unsharp=5:5:1.5:5:5:1.5,eq=contrast=1.15:saturation=1.35:brightness=0.01,"
            "drawtext=text='ANIME UNDERWORLD':x=(w-text_w)/2:y=(h-text_h)/2:fontsize=36:fontcolor=white@0.15:box=0"
        )
        filter_a = "aselect='lt(mod(t,26),25)',asetpts=N/SR/TB,asetrate=44100*1.04,atempo=0.96"

        ffmpeg_cmd = [
            'ffmpeg', '-y', '-re',
            '-i', stream_direct_url,
            '-vf', filter_v,
            '-af', filter_a,
            '-c:v', 'libx264', '-preset', 'ultrafast', '-tune', 'zerolatency', '-crf', '23',
            '-c:a', 'aac', '-b:a', '128k',
            '-f', 'flv', f'rtmp://a.rtmp.youtube.com/live2/{s_key}'
        ]

        subprocess.run(ffmpeg_cmd)
        EOF

        python run_stream.py
        
        python run_stream.py
        
