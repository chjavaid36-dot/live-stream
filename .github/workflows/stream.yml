name: YouTube Live Stream from Google Drive

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Google Drive Video Shareable Link'
        required: true
      stream_key:
        description: 'YouTube Stream Key'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg curl
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp

    - name: Run Live Streaming
      env:
        GDRIVE_URL: ${{ github.event.inputs.gdrive_url }}
        STREAM_KEY: ${{ github.event.inputs.stream_key }}
      run: |
        cat << 'EOF' > run_stream.py
        import subprocess, sys, os

        g_url = os.environ.get('GDRIVE_URL', '').strip()
        s_key = os.environ.get('STREAM_KEY', '').strip()

        print("Fetching direct video stream URL from Google Drive...")

        # Extract direct stream URL from Google Drive
        cmd = ['yt-dlp', '-g', g_url]

        try:
            res = subprocess.run(cmd, capture_output=True, text=True, check=True)
            stream_direct_url = res.stdout.strip().split('\n')[0]
            print("Successfully extracted Google Drive Stream URL!")
        except Exception as e:
            print("Error extracting link from Google Drive. Ensure link is set to 'Anyone with link'.")
            if hasattr(e, 'stderr'):
                print(e.stderr)
            sys.exit(1)

        # CLEAN Anti-copyright filters (Prevents 360/VR Glitch completely)
        filter_v = (
            "scale=1920:1080:force_original_aspect_ratio=decrease,"
            "pad=1920:1080:(ow-iw)/2:(oh-ih)/2,"
            "eq=contrast=1.05:saturation=1.15:brightness=0.01,"
            "unsharp=3:3:1.0:3:3:1.0,"
            "drawtext=text='ANIME UNDERWORLD':x=(w-text_w)/2:y=(h-text_h)/2:fontsize=36:fontcolor=white@0.12:box=0"
        )
        filter_a = "asetrate=44100*1.02,atempo=0.98"

        # FFmpeg strictly configured for Standard Flat 1080p HD Video
        ffmpeg_cmd = [
            'ffmpeg', '-y',
            '-stream_loop', '-1',
            '-re',
            '-i', stream_direct_url,
            '-vf', filter_v,
            '-af', filter_a,
            '-c:v', 'libx264',
            '-preset', 'ultrafast',
            '-tune', 'zerolatency',
            '-b:v', '3500k',
            '-maxrate', '4000k',
            '-bufsize', '8000k',
            '-pix_fmt', 'yuv420p',
            '-g', '50',
            '-c:a', 'aac',
            '-b:a', '128k',
            '-ar', '44100',
            '-f', 'flv', f'rtmp://a.rtmp.youtube.com/live2/{s_key}'
        ]

        subprocess.run(ffmpeg_cmd)
        EOF

        python run_stream.py
        
